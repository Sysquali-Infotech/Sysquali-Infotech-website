<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0288d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26c6da;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00acc1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon Graphic -->
  <g transform="translate(10, 5)">
    <!-- Outer S/Q stylized loops -->
    <path d="M 65,25 C 90,25 110,45 110,70 C 110,85 102,98 90,105 L 105,125" fill="none" stroke="url(#grad1)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 65,115 C 35,115 15,95 15,70 C 15,48 28,30 48,26" fill="none" stroke="url(#grad2)" stroke-width="10" stroke-linecap="round"/>
    <!-- Diagonal cross stem for Q and S shape link -->
    <line x1="35" y1="105" x2="95" y2="35" stroke="url(#grad1)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="95" cy="35" r="7" fill="#00e5ff"/>
  </g>
  <!-- Typography -->
  <text x="140" y="68" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#0d47a1">Sysquali</text>
  <text x="142" y="105" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#1565c0" letter-spacing="4">INFOTECH</text>
  <text x="144" y="128" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#78909c" letter-spacing="1.5">TRUSTED IT SOLUTIONS &amp; CONSULTING</text>
</svg>
